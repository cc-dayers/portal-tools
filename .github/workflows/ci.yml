name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare yarn@4.18.0 --activate
      - run: yarn install --immutable
      - run: yarn check
      - run: yarn test
      - run: yarn npm audit --all --recursive --severity moderate
