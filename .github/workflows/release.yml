name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare yarn@4.18.0 --activate
      - run: yarn install --immutable
      - run: yarn check
      - run: yarn test
      - run: yarn npm audit --all --recursive --severity moderate
      - run: mkdir -p dist && npm pack --pack-destination dist
      - run: gh release create "$GITHUB_REF_NAME" dist/*.tgz --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
